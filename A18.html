<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Assignment 18: Accessible Student Admission Page</title>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 20px;
        }

        header,
        footer {
            background-color: #162473;
            color: white;
            text-align: center;
            padding: 14px;
        }

        main {
            max-width: 650px;
            margin: 20px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eef1fa;
            text-align: center;
        }

        fieldset {
            padding: 15px;
        }

        input,
        select,
        textarea {
            margin-top: 4px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section aria-labelledby="courses-heading">
            <h2 id="courses-heading">Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Seats</th>
                        <th scope="col">Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section aria-label="Admission Form">
            <form action="#" method="post">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="applicant-name">Name:</label><br>
                    <input type="text" id="applicant-name" name="name" required><br>

                    <label for="applicant-email">Email:</label><br>
                    <input type="email" id="applicant-email" name="email" required><br>

                    <label for="applicant-course">Course:</label><br>
                    <select id="applicant-course" name="course">
                        <option value="btech-cse" selected>B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select><br>

                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="3" cols="50" required></textarea><br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>

</html>
