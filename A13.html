<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Assignment 13: Rowspan and Colspan (Timetable)</title>
</head>

<body>
    <table border="1" cellpadding="6">
        <caption><strong>Weekly Timetable</strong></caption>
        <thead>
            <tr>
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mon</td>
                <td>Maths</td>
                <td>HTML</td>
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr>
                <td>Tue</td>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
            <tr>
                <td>Wed</td>
                <td colspan="3" align="center">Seminar</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
