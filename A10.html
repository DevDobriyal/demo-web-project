<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Assignment 10: Multimedia - Image, Video, Audio and YouTube</title>
</head>

<body>
    <h4>Image</h4>
    <img src="campus.jpg" alt="College campus" width="180" height="150">

    <h4>Video</h4>
    <video width="240" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h4>Audio</h4>
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h4>YouTube</h4>
    <iframe width="360" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player"
        allowfullscreen></iframe>
</body>

</html>
